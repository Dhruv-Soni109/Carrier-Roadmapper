services:
  - type: web
    name: pathforge
    env: node
    plan: free
    buildCommand: npm install && npm --prefix server install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 8080
      - key: NODE_ENV
        value: production
      - key: MOCK_AI
        value: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
